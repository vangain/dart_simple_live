name: Build Android 16 APK (Super Robust)

on:
  workflow_dispatch:

env:
  # 统一使用 2.1.0，并配合下方的强制对齐策略
  K_VERSION: "2.1.0"
  SDK_VERSION: "36"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 1. 签名自动处理（保持不变，确保无缝更新）
      - name: Setup Persistent Keystore
        working-directory: ./simple_live_app/android
        run: |
          if [ ! -f "my_release.keystore" ]; then
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f my_release.keystore
            git commit -m "Auto-generate persistent keystore"
            git push
          fi
          echo "storeFile=$(pwd)/my_release.keystore" > key.properties
          echo "storePassword=123456" >> key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties

      # 2. 【核心修复】直接调用原生 Python 解释器，彻底解决引号/语法错误
      - name: Force Update Versions
        shell: python
        run: |
          import os, re
          
          # 修复 settings.gradle (Kotlin 插件版本)
          s_path = 'simple_live_app/android/settings.gradle'
          if os.path.exists(s_path):
              with open(s_path, 'r') as f: content = f.read()
              content = re.sub(r'id\s*\(?["\']org\.jetbrains\.kotlin\.android["\']\)?\s*version\s*["\']([^"\']+)["\']', 
                              'id "org.jetbrains.kotlin.android" version "${{ env.K_VERSION }}"', content)
              with open(s_path, 'w') as f: f.write(content)

          # 修复 app 级 build.gradle (SDK 版本)
          # 遍历可能的路径 (.kts 或普通 gradle)
          for bp in ['simple_live_app/android/app/build.gradle.kts', 'simple_live_app/android/app/build.gradle']:
              if os.path.exists(bp):
                  with open(bp, 'r') as f: content = f.read()
                  content = re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk = ${{ env.SDK_VERSION }}', content)
                  content = re.sub(r'targetSdk\s*=?\s*\d+', 'targetSdk = ${{ env.SDK_VERSION }}', content)
                  content = re.sub(r'compileSdkVersion\s*\d+', 'compileSdkVersion ${{ env.SDK_VERSION }}', content)
                  content = re.sub(r'targetSdkVersion\s*\d+', 'targetSdkVersion ${{ env.SDK_VERSION }}', content)
                  with open(bp, 'w') as f: f.write(content)
                  print(f"Successfully updated {bp}")

      # 3. 【终极对齐】注入全局解析策略，强制所有第三方库使用相同的 Kotlin 版本
      - name: Inject Global Resolution Strategy
        run: |
          cat <<EOF >> simple_live_app/android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '${{ env.K_VERSION }}'
                      }
                  }
              }
          }
          EOF

      # 4. 编译打包
      - name: Build APK
        working-directory: ./simple_live_app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16-Arm64
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
