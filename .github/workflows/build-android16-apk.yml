name: Build Android 16 (Final Fix 2026)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"

      # 签名逻辑：生成一次后会自动存在你仓库里，以后更新签名就一致了
      - name: Setup Keystore
        working-directory: ./simple_live_app/android
        run: |
          if [ ! -f "my_release.keystore" ]; then
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f my_release.keystore
            git commit -m "chore: persist keystore"
            git push
          fi
          echo "storeFile=$(pwd)/my_release.keystore" > key.properties
          echo "storePassword=123456" >> key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties

      # 【核心改动】创建一个全局 init.gradle 脚本，从外部强行锁定版本
      - name: Create Global Init Script
        run: |
          cat <<EOF > fix_build.gradle
          allprojects {
              buildscript {
                  configurations.all {
                      resolutionStrategy.force "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0"
                  }
              }
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          defaultConfig {
                              targetSdkVersion 36
                          }
                      }
                  }
                  project.configurations.all {
                      resolutionStrategy.eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin') {
                              details.useVersion '2.3.0'
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          # 使用 --init-script 挂载我们写的“外挂”脚本
          flutter build apk --release --target-platform android-arm64 --performance-measurement \
            --extra-front-end-options="--no-implicit-dynamic" \
            -- --init-script ../fix_build.gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16-Final
          # 使用通配符，防止文件名因为 Flutter 版本不同而发生变化
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
