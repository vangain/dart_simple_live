name: Build Android 16 APK (2026 Fixed Syntax)

于:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"

      # 签名固化逻辑
      - name: Setup Keystore
        working-directory: ./simple_live_app/android
        run: |
          if [ ! -f "my_release.keystore" ]; then
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f my_release.keystore
            git commit -m "chore: fixed keystore for android 16"
            git push
          fi
          echo "storeFile=$(pwd)/my_release.keystore" > key.properties
          echo "storePassword=123456" >> key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties

      # 使用 Python 精准区分 .gradle 和 .kts 的引号规则
      - name: Patch Android Project
        shell: python
        run: |
          import os, re
          
          # 1. 修改 settings.gradle (通常是 Groovy，但也可能含 Kotlin 插件定义)
          s_path = 'simple_live_app/android/settings.gradle'
          if os.path.exists(s_path):
              with open(s_path, 'r') as f: content = f.read()
              content = re.sub(r'id\s*\(?["\']org\.jetbrains\.kotlin\.android["\']\)?\s*version\s*["\'][^"\']+["\']', 
                              'id "org.jetbrains.kotlin.android" version "2.1.0"', content)
              with open(s_path, 'w') as f: f.write(content)

          # 2. 遍历修改 build.gradle 和 build.gradle.kts
          for bp in ['simple_live_app/android/app/build.gradle.kts', 'simple_live_app/android/app/build.gradle']:
              if os.path.exists(bp):
                  is_kts = bp.endswith('.kts')
                  # 重要：KTS 必须用双引号 (")，Groovy 可以用单引号 (')
                  q = '"' if is_kts else "'"
                  
                  with open(bp, 'r') as f: content = f.read()
                  
                  # 替换 SDK 版本
                  content = re.sub(r'compileSdk\s*=?\s*\d+', f'compileSdk = 36', content)
                  content = re.sub(r'targetSdk\s*=?\s*\d+', f'targetSdk = 36', content)
                  content = re.sub(r'compileSdkVersion\s*\d+', f'compileSdkVersion 36', content)
                  content = re.sub(r'targetSdkVersion\s*\d+', f'targetSdkVersion 36', content)
                  
                  # 注入 Kotlin 版本强制对齐策略
                  if 'resolutionStrategy' not in content:
                      if is_kts:
                          # Kotlin DSL 语法
                          strategy = f'\nconfigurations.all {{ resolutionStrategy {{ eachDependency {{ if (requested.group == {q}org.jetbrains.kotlin{q}) {{ useVersion({q}2.1.0{q}) }} }} }} }}\n'
                      else:
                          # Groovy 语法
                          strategy = f'\nconfigurations.all {{ resolutionStrategy.eachDependency {{ details -> if (details.requested.group == {q}org.jetbrains.kotlin{q}) {{ details.useVersion {q}2.1.0{q} }} }} }}\n'
                      content += strategy
                  
                  with open(bp, 'w') as f: f.write(content)
                  print(f"Patched {bp} with correct quotes for {'Kotlin' if is_kts else 'Groovy'}")

      - name: Build APK
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16-2026
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
