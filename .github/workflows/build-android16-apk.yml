name: Build Android 16 APK (Final Robust)

on:
  workflow_dispatch:

env:
  # 经过验证，对于 Flutter 3.38，2.1.0 是目前最稳健的选择
  K_VERSION: "2.1.0"
  SDK_VERSION: "36"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 1. 自动签名逻辑（保持不变，确保您能正常安装和更新）
      - name: Setup Persistent Keystore
        working-directory: ./simple_live_app/android
        run: |
          if [ ! -f "my_release.keystore" ]; then
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f my_release.keystore
            git commit -m "Auto-generate persistent keystore"
            git push
          fi
          echo "storeFile=$(pwd)/my_release.keystore" > key.properties
          echo "storePassword=123456" >> key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties

      # 2. 【核心稳健步骤】使用 Python 进行物理级版本替换，避开 sed 漏洞
      - name: Force Update Versions (Python Script)
        working-directory: ./simple_live_app/android
        run: |
          python3 -c "
          import re, os
          # 修复 settings.gradle 中的插件版本
          if os.path.exists('settings.gradle'):
              c = open('settings.gradle').read()
              c = re.sub(r'(id\s*[\"|\']org.jetbrains.kotlin.android[\"']\s*version\s*[\"|\'])([^\"|\']+)([\"|\'])', r'\g<1>${{ env.K_VERSION }}\g<3>', c)
              open('settings.gradle', 'w').write(c)
          
          # 修复 app 目录下的 SDK 版本
          bp = 'app/build.gradle.kts'
          if not os.path.exists(bp): bp = 'app/build.gradle'
          if os.path.exists(bp):
              c = open(bp).read()
              c = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = ${{ env.SDK_VERSION }}', c)
              c = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = ${{ env.SDK_VERSION }}', c)
              c = re.sub(r'compileSdkVersion\s*\d+', 'compileSdkVersion ${{ env.SDK_VERSION }}', c)
              c = re.sub(r'targetSdkVersion\s*\d+', 'targetSdkVersion ${{ env.SDK_VERSION }}', c)
              open(bp, 'w').write(c)
          "

      # 3. 【终极绝招】在全局 build.gradle 中注入策略，强制所有依赖库版本对齐
      # 这能解决 metadata 2.3.0 vs 2.1.0 的冲突
      - name: Inject Global Resolution Strategy
        working-directory: ./simple_live_app/android
        run: |
          echo "
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '${{ env.K_VERSION }}'
                      }
                  }
              }
          }
          " >> build.gradle

      # 4. 清理并打包
      - name: Build APK
        working-directory: ./simple_live_app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16-Arm64
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
