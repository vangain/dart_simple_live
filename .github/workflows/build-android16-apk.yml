name: Build Android 16 APK

on:
  workflow_dispatch: 

# 【重要新增】赋予 GitHub Actions 往您的仓库里写入/保存文件的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 【核心改动】自动生成并永久保存签名文件到您的仓库
      - name: Setup Persistent Keystore
        working-directory: ./simple_live_app/android
        run: |
          # 检查仓库里是否已经有我们生成的签名文件
          if [ ! -f "my_release.keystore" ]; then
            echo "未找到签名文件，正在生成并保存到仓库..."
            # 生成有效期 10000 天的专属签名
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            
            # 配置 Git 机器人信息
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            # 强制添加签名文件（绕过 .gitignore 限制）并推送到您的 GitHub 仓库
            git add -f my_release.keystore
            git commit -m "Auto-generate persistent keystore for seamless updates"
            git push
          else
            echo "检测到已存在的签名文件，直接使用以保证更新时的签名一致性！"
          fi
          
          # 动态生成打包所需的配置文件
          echo "storePassword=123456" > key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties
          echo "storeFile=$(pwd)/my_release.keystore" >> key.properties

      - name: Set SDK Version to 36
        working-directory: ./simple_live_app
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts || true
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts || true

      - name: Install Dependencies
        working-directory: ./simple_live_app
        run: flutter pub get

      - name: Build APK (Release & Arm64)
        working-directory: ./simple_live_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16-Arm64
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
