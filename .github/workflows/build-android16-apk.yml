name: Build Android 16 APK (2026 Stable)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"

      # 签名固化（自动管理你的密钥）
      - name: Setup Keystore
        working-directory: ./simple_live_app/android
        run: |
          if [ ! -f "my_release.keystore" ]; then
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f my_release.keystore
            git commit -m "chore: persist keystore for android 16"
            git push
          fi
          echo "storeFile=$(pwd)/my_release.keystore" > key.properties
          echo "storePassword=123456" >> key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties

      # 使用 Python 彻底解决版本冲突，避开 Bash 引号地狱
      - name: Patch Project Versions
        shell: python
        run: |
          import os, re
          
          # 1. 强制修改 settings.gradle 中的 Kotlin 插件版本为 2.3.0
          s_path = 'simple_live_app/android/settings.gradle'
          if os.path.exists(s_path):
              with open(s_path, 'r') as f: content = f.read()
              # 匹配各种写法，统一改为 2.3.0
              content = re.sub(r'id\s*\(?["\']org\.jetbrains\.kotlin\.android["\']\)?\s*version\s*["\'][^"\']+["\']', 
                              'id "org.jetbrains.kotlin.android" version "2.3.0"', content)
              with open(s_path, 'w') as f: f.write(content)
              print("Settings.gradle updated.")

          # 2. 注入全局 Resolution Strategy 到 build.gradle
          # 强制所有第三方库必须使用 2.3.0 的 Kotlin 核心库
          b_path = 'simple_live_app/android/build.gradle'
          strategy = """
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '2.3.0'
                      }
                  }
              }
          }
          """
          if os.path.exists(b_path):
              with open(b_path, 'a') as f: f.write(strategy)
              print("Global strategy injected.")

          # 3. 强制提升 SDK 版本到 36 (Android 16)
          for bp in ['simple_live_app/android/app/build.gradle.kts', 'simple_live_app/android/app/build.gradle']:
              if os.path.exists(bp):
                  with open(bp, 'r') as f: content = f.read()
                  content = re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk = 36', content)
                  content = re.sub(r'targetSdk\s*=?\s*\d+', 'targetSdk = 36', content)
                  content = re.sub(r'compileSdkVersion\s*\d+', 'compileSdkVersion 36', content)
                  content = re.sub(r'targetSdkVersion\s*\d+', 'targetSdkVersion 36', content)
                  with open(bp, 'w') as f: f.write(content)
                  print(f"SDK version updated in {bp}")

      - name: Build APK
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16-Final
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
