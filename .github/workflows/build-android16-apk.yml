name: Build Android 16 APK (Final Version 2026)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"

      # 签名逻辑：生成后永久存放在你的仓库，解决安装包签名一致性
      - name: Setup Keystore
        working-directory: ./simple_live_app/android
        run: |
          if [ ! -f "my_release.keystore" ]; then
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f my_release.keystore
            git commit -m "chore: persist keystore"
            git push
          fi
          echo "storeFile=$(pwd)/my_release.keystore" > key.properties
          echo "storePassword=123456" >> key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties

      # 使用 Python 脚本彻底修补项目配置，避开 Shell 引号问题
      - name: Patch Android Project
        shell: python
        run: |
          import os, re
          
          # 1. 修改 settings.gradle，强制 Kotlin 插件版本为 2.3.0
          s_path = 'simple_live_app/android/settings.gradle'
          if os.path.exists(s_path):
              with open(s_path, 'r') as f: content = f.read()
              content = re.sub(r'id\s*\(?["\']org\.jetbrains\.kotlin\.android["\']\)?\s*version\s*["\'][^"\']+["\']', 
                              'id "org.jetbrains.kotlin.android" version "2.3.0"', content)
              with open(s_path, 'w') as f: f.write(content)

          # 2. 修改 app/build.gradle，强制 SDK 36 并注入 Kotlin 强制对齐策略
          for bp in ['simple_live_app/android/app/build.gradle.kts', 'simple_live_app/android/app/build.gradle']:
              if os.path.exists(bp):
                  with open(bp, 'r') as f: content = f.read()
                  # 替换 SDK 版本
                  content = re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk = 36', content)
                  content = re.sub(r'targetSdk\s*=?\s*\d+', 'targetSdk = 36', content)
                  content = re.sub(r'compileSdkVersion\s*\d+', 'compileSdkVersion 36', content)
                  content = re.sub(r'targetSdkVersion\s*\d+', 'targetSdkVersion 36', content)
                  
                  # 在文件末尾注入全局 Kotlin 版本锁定策略
                  if 'resolutionStrategy' not in content:
                      content += "\nconfigurations.all { resolutionStrategy.eachDependency { details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '2.3.0' } } }\n"
                  
                  with open(bp, 'w') as f: f.write(content)

      - name: Build APK
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          # 删除了所有可能报错的自定义 Flag，只留最纯净的编译命令
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16-Final
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
