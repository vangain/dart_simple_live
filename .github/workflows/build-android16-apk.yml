name: Build Android 16 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10' # 严格匹配你日志中的版本
          cache: true

      # 签名设置：必须有签名，Android 16 才会允许安装
      - name: Setup Keystore
        working-directory: ./simple_live_app/android
        run: |
          if [ ! -f "my_release.keystore" ]; then
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f my_release.keystore
            git commit -m "Add permanent keystore"
            git push
          fi
          echo "storeFile=$(pwd)/my_release.keystore" > key.properties
          echo "storePassword=123456" >> key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties

      # 严格修复：直接修改版本号，不注入额外代码
      - name: Patch Versions
        run: |
          # 1. 修复 Kotlin 版本（解决 metadata 2.3.0 报错）
          # 根据 Flutter Fix 提示，修改 settings.gradle 中的插件版本
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.3.0"/g' simple_live_app/android/settings.gradle
          
          # 2. 修改 Android SDK 版本为 36 (Android 16)
          # 修改 app/build.gradle.kts 中的 compileSdk 和 targetSdk
          sed -i 's/compileSdk = .*/compileSdk = 36/g' simple_live_app/android/app/build.gradle.kts
          sed -i 's/targetSdk = .*/targetSdk = 36/g' simple_live_app/android/app/build.gradle.kts

      - name: Build APK
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
