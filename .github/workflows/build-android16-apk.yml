name: Build Android 16 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true

      # 显式安装 Android 16 SDK (API 36)，防止云端环境缺失
      - name: Install Android 16 SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # 签名设置（保持不变，确保安装包可以被系统接受）
      - name: Setup Keystore
        working-directory: ./simple_live_app/android
        run: |
          if [ ! -f "my_release.keystore" ]; then
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f my_release.keystore
            git commit -m "chore: add keystore"
            git push
          fi
          echo "storeFile=$(pwd)/my_release.keystore" > key.properties
          echo "storePassword=123456" >> key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties

      # 精准修改版本号（不再使用模糊匹配，防止拼写错误）
      - name: Patch Android Configuration
        working-directory: ./simple_live_app/android
        run: |
          # 1. 修复 Kotlin 版本为 2.3.0（解决 metadata 2.3.0 报错）
          # 使用 @ 作为定界符，防止路径或特殊符号干扰，直接匹配含有 kotlin.android 的行并重写
          sed -i '/id("org.jetbrains.kotlin.android") version/c\    id("org.jetbrains.kotlin.android") version "2.3.0"' settings.gradle
          
          # 2. 修复 SDK 版本为 36 (针对 build.gradle.kts)
          # c\ 命令会直接替换整行内容，绝对不会出现 36flutter 这种合并错误
          sed -i '/compileSdk = .*/c\    compileSdk = 36' app/build.gradle.kts
          sed -i '/targetSdk = .*/c\        targetSdk = 36' app/build.gradle.kts

      - name: Build APK
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
