name: Build Android 16 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true

      # 签名证书：Android 16 必须有签名才能安装，此处采用自动生成并存储的方案
      - name: Setup Keystore
        working-directory: ./simple_live_app/android
        run: |
          if [ ! -f "my_release.keystore" ]; then
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f my_release.keystore
            git commit -m "chore: add keystore for release signing"
            git push
          fi
          echo "storeFile=$(pwd)/my_release.keystore" > key.properties
          echo "storePassword=123456" >> key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties

      # 【工程级修复】使用 Python 脚本精准定位并改写版本配置
      # 理由：Python 处理多行文本和引号比 sed 稳健 100 倍，不会产生乱码或合并错误
      - name: Patch Android Configuration
        shell: python
        run: |
          import os, re
          
          # 1. 修正 settings.gradle 中的 Kotlin 插件版本（解决 metadata 2.3.0 报错）
          s_path = 'simple_live_app/android/settings.gradle'
          if os.path.exists(s_path):
              with open(s_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              # 无论原版本是多少，精准定位 id(...) version "..." 结构并替换整段
              new_content = re.sub(r'(id\s*\(?["\']org\.jetbrains\.kotlin\.android["\']\)?\s+version\s+)"[^"]+"', 
                                   r'\1"2.3.0"', content)
              with open(s_path, 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print(f"Successfully patched {s_path}")

          # 2. 修正 app/build.gradle.kts 中的 SDK 版本（适配 Android 16）
          b_path = 'simple_live_app/android/app/build.gradle.kts'
          if os.path.exists(b_path):
              with open(b_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              # 替换 compileSdk = ... 为硬编码的 36
              content = re.sub(r'compileSdk\s*=\s*.*', 'compileSdk = 36', content)
              # 替换 targetSdk = ... 为硬编码的 36
              content = re.sub(r'targetSdk\s*=\s*.*', 'targetSdk = 36', content)
              with open(b_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f"Successfully patched {b_path}")

      - name: Build APK
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
