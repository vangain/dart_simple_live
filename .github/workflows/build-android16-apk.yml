name: Build Android 16 APK

on:
  workflow_dispatch: 

# 赋予 GitHub Actions 往仓库写入文件的权限（用于保存签名）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 自动生成并永久保存签名文件到您的仓库
      - name: Setup Persistent Keystore
        working-directory: ./simple_live_app/android
        run: |
          if [ ! -f "my_release.keystore" ]; then
            echo "未找到签名文件，正在生成并保存到仓库..."
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f my_release.keystore
            git commit -m "Auto-generate persistent keystore for seamless updates"
            git push
          else
            echo "检测到已存在的签名文件，直接使用以保证更新时的签名一致性！"
          fi
          
          echo "storePassword=123456" > key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties
          echo "storeFile=$(pwd)/my_release.keystore" >> key.properties

      # 【重要新增】强制升级 Kotlin 编译版本为 2.1.0，解决版本不匹配报错
      - name: Update Kotlin Version
        working-directory: ./simple_live_app
        run: |
          # 针对新版 Flutter 结构 (settings.gradle)
          sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' android/settings.gradle || true
          sed -i -E "s/id 'org.jetbrains.kotlin.android' version '[^']+'/id 'org.jetbrains.kotlin.android' version '2.1.0'/g" android/settings.gradle || true
          
          # 针对旧版/KTS 结构 (build.gradle 或 build.gradle.kts)
          sed -i -E "s/ext.kotlin_version = '[^']+'/ext.kotlin_version = '2.1.0'/g" android/build.gradle || true
          sed -i -E 's/ext.kotlin_version = "[^"]+"/ext.kotlin_version = "2.1.0"/g' android/build.gradle || true
          sed -i -E "s/ext.kotlin_version = '[^']+'/ext.kotlin_version = '2.1.0'/g" android/build.gradle.kts || true
          sed -i -E 's/ext.kotlin_version = "[^"]+"/ext.kotlin_version = "2.1.0"/g' android/build.gradle.kts || true

      # 修改 Android SDK 目标版本为 36 (Android 16)
      - name: Set SDK Version to 36
        working-directory: ./simple_live_app
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts || true
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts || true

      - name: Install Dependencies
        working-directory: ./simple_live_app
        run: flutter pub get

      - name: Build APK (Release & Arm64)
        working-directory: ./simple_live_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16-Arm64
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
