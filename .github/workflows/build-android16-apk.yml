name: Build Android 16 APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 新增步骤：自动生成临时的签名证书和 key.properties，解决 null 报错
      - name: Generate Dummy Keystore & key.properties
        working-directory: ./simple_live_app/android
        run: |
          # 自动生成一个有效期 10000 天的临时 keystore
          keytool -genkey -v -keystore dummy.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          # 创建打包必须的 key.properties 配置文件
          echo "storePassword=123456" > key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties
          echo "storeFile=$(pwd)/dummy.keystore" >> key.properties

      # 针对新版的 Kotlin DSL (.kts) 语法修改 SDK 版本
      - name: Set SDK Version to 36
        working-directory: ./simple_live_app
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts || true
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts || true

      - name: Install Dependencies
        working-directory: ./simple_live_app
        run: flutter pub get

      - name: Build APK (Release & Arm64)
        working-directory: ./simple_live_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android16-Arm64
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
