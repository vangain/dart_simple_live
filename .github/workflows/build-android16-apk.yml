name: Build Android 16 APK (2026 Edition)

on:
  workflow_dispatch:

env:
  # 既然报错 metadata 是 2.3.0，我们就必须使用 2.3.0
  K_VERSION: "2.3.0"
  SDK_VERSION: "36"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"

      # 签名固化（这一步是您更新软件的关键，保持不变）
      - name: Setup Keystore
        working-directory: ./simple_live_app/android
        run: |
          if [ ! -f "my_release.keystore" ]; then
            keytool -genkey -v -keystore my_release.keystore -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SimpleLive,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f my_release.keystore
            git commit -m "Fix: Persistent keystore for Android 16"
            git push
          fi
          echo "storeFile=$(pwd)/my_release.keystore" > key.properties
          echo "storePassword=123456" >> key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties

      # 【绝招】强制重写全局 Gradle 策略，解决 Kotlin 2.3.0 冲突
      - name: Force Overwrite Gradle Config
        run: |
          # 1. 强制修改 settings.gradle 中的插件版本
          sed -i -E 's/id\s*\(?["\']org\.jetbrains\.kotlin\.android["\']\)?\s*version\s*["\'][^"\']+["\']/id "org.jetbrains.kotlin.android" version "${{ env.K_VERSION }}"/g' simple_live_app/android/settings.gradle || true
          
          # 2. 在根目录 build.gradle 注入“核武器”级版本强制对齐
          cat <<EOF > simple_live_app/android/build.gradle
          buildscript {
              ext.kotlin_version = '${{ env.K_VERSION }}'
              repositories { google(); mavenCentral() }
              dependencies { classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '${{ env.K_VERSION }}'
                      }
                  }
              }
          }
          EOF

          # 3. 修正 API 版本
          find simple_live_app/android -name "build.gradle*" -exec sed -i 's/compileSdk\s*=?\s*[0-9]*/compileSdk = ${{ env.SDK_VERSION }}/g' {} +
          find simple_live_app/android -name "build.gradle*" -exec sed -i 's/targetSdk\s*=?\s*[0-9]*/targetSdk = ${{ env.SDK_VERSION }}/g' {} +

      - name: Build APK
        working-directory: ./simple_live_app
        run: |
          flutter pub get
          # 加上 --target-platform 确保生成的是针对 Android 16 手机的 arm64 包
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-2026-Android16
          # 使用通配符，防止路径中文件名带有架构标识导致找不到文件
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
