build-mac-ios-android1:
  runs-on: macos-14
  name: 编译 macOS/iOS/Android 端
  env:
    # 强制所有 actions 使用 Node.js 24（官方推荐的临时解决方案）
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    FLUTTER_VERSION: '3.38.3'
    PUB_HOSTED_URL: 'https://pub.flutter-io.cn'
    FLUTTER_STORAGE_BASE_URL: 'https://storage.flutter-io.cn'

  steps:
    # 1. 升级到支持 Node.js 24 的 checkout v5
    - name: 检出完整代码历史（用于自动获取版本号）
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false  # 保留原项目的权限修复

    # 2. 升级到支持 Node.js 24 的 flutter-action v2.16.0+
    - name: 设置 Flutter 环境
      uses: subosito/flutter-action@v2.16.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    # 3. 修复 macOS 14 上 Xcode 命令行工具配置问题
    - name: 配置 Xcode 环境
      run: |
        sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
        xcodebuild -version

    - name: 验证 Flutter 环境
      run: |
        flutter --version
        flutter config --no-analytics

    - name: 清理并获取项目依赖
      run: |
        flutter clean
        flutter pub get

    # 4. 编译 Android APK
    - name: 编译 Android Release
      working-directory: simple_live_app
      run: |
        flutter build apk --release --target-platform android-arm64,android-arm
        mv build/app/outputs/flutter-apk/app-release.apk ../Simple-Live-Android-${{ github.ref_name }}.apk

    # 5. 编译 iOS IPA（无签名版）
    - name: 编译 iOS Release
      working-directory: simple_live_app
      run: |
        flutter build ios --release --no-codesign
        cd build/ios/iphoneos
        mkdir Payload
        mv Runner.app Payload
        zip -r ../../../Simple-Live-iOS-${{ github.ref_name }}.ipa Payload

    # 6. 编译 macOS 桌面端
    - name: 编译 macOS Release
      working-directory: simple_live_app
      run: |
        flutter build macos --release
        cd build/macos/Build/Products/Release
        zip -r ../../../../../Simple-Live-macOS-${{ github.ref_name }}.zip "Simple Live.app"

    # 7. 上传所有产物
    - name: 上传 Android 产物
      uses: actions/upload-artifact@v4.4.0  # 同样升级到支持 Node.js 24 的版本
      with:
        name: Simple-Live-Android-${{ github.ref_name }}
        path: Simple-Live-Android-${{ github.ref_name }}.apk
        retention-days: 30

    - name: 上传 iOS 产物
      uses: actions/upload-artifact@v4.4.0
      with:
        name: Simple-Live-iOS-${{ github.ref_name }}
        path: Simple-Live-iOS-${{ github.ref_name }}.ipa
        retention-days: 30

    - name: 上传 macOS 产物
      uses: actions/upload-artifact@v4.4.0
      with:
        name: Simple-Live-macOS-${{ github.ref_name }}
        path: Simple-Live-macOS-${{ github.ref_name }}.zip
        retention-days: 30
